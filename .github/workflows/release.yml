name: Build & Release (Windows)

# Switch AI —— Windows 安装包构建与 GitHub Release 发布。
#
# 触发方式：
#   ① 推送版本 tag（v*）→ 自动构建并发布同名 Release；
#   ② 手动 workflow_dispatch → 指定 tag 构建并发布（tag 不存在时自动创建）。
#
# 设计要点：
#   - 与 build-windows.yml（仅构建、仅上传 artifact）互补：本工作流负责**发版**。
#   - 复用 scripts/rename_release.mjs 的输出约定与 scripts/package_portable.mjs 的
#     便携版打包（该脚本已内置 CI 下 tar/中文文件名 的规避处理）。
#   - 产物三类：NSIS 安装包(*.exe) / MSI 安装包(*.msi) / 便携版 zip。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例：v3.7.3）'
        required: true
        type: string

# 创建 Release / 上传资产需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # 前端类型检查 + 构建（tauri build 的 beforeBuildCommand 也会跑，
      # 这里先行一步让类型错误更早暴露）
      - name: Type-check & build frontend
        run: npm run build

      # target/ 走 actions/cache 加速构建，但 bundle/ 是「上次构建的安装包输出目录」，
      # 缓存恢复后旧版本安装包仍留在其中；若直接 cp *.exe 会把**旧版本安装包**
      # 一并带进本次 release（实测发生过：v3.7.4 的 release 里混进了 3.7.3 的
      # setup.exe / .msi）。构建前先清掉该目录，从源头杜绝串版本。
      - name: Clean stale bundle output
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle
          echo "bundle/ 已清空，避免缓存残留旧版本安装包"

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri build -- --bundles nsis,msi

      # 便携版 zip：零依赖（Windows 自带 tar.exe），从 release 产物打包
      - name: Package portable zip
        run: node scripts/package_portable.mjs

      - name: Stage artifacts (release/windows)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*\"([0-9]+\.[0-9]+\.[0-9]+)\"/m)[1]")
          echo "本次构建版本: $VERSION"
          mkdir -p release/windows
          rm -f release/windows/*
          cp src-tauri/target/release/bundle/nsis/*.exe release/windows/
          cp src-tauri/target/release/bundle/msi/*.msi release/windows/
          cp release/*_x64_portable.zip release/windows/
          echo "--- staged ---"; ls -la release/windows/
          # 守卫：只允许本次版本号的产物进入 release（防缓存/历史残留串版本）
          TOTAL=$(ls release/windows/ | wc -l)
          MATCH=$(ls release/windows/ | grep -c "_${VERSION}_" || true)
          if [ "$MATCH" -ne "$TOTAL" ]; then
            echo "::error::发现非本次版本(${VERSION})的产物，拒绝发布："
            ls release/windows/ | grep -v "_${VERSION}_" || true
            exit 1
          fi
          echo "版本守卫通过：$MATCH/$TOTAL 个产物均为 $VERSION"

      # 发布校验清单 latest.json：版本号 + 各资产 SHA-256，作为 Release 资产一并上传。
      # 更新器（updater.rs::fetch_manifest_hash）下载安装包后与清单比对，不匹配即拒绝安装。
      # 清单缺失时更新器会回退「正文 SHA256 约定行」，而本工作流的正文是自动生成的、
      # 不含 SHA 行 —— 于是完整性校验被静默跳过（能装但没有校验）。必须在此显式生成。
      - name: Generate update manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync, existsSync, readdirSync } = require("node:fs");
            const ver = readFileSync("src-tauri/Cargo.toml", "utf8")
              .match(/^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"/m)[1];
            const dir = "release/windows";
            const assets = {};
            for (const name of readdirSync(dir)) {
              if (name === "latest.json") continue;
              assets[name] = createHash("sha256")
                .update(readFileSync(`${dir}/${name}`))
                .digest("hex");
            }
            const setup = Object.keys(assets).find((n) => n.endsWith("-setup.exe"));
            if (!setup) { console.error("::error::清单生成失败：未找到 NSIS setup.exe"); process.exit(1); }
            writeFileSync(`${dir}/latest.json`, JSON.stringify({ version: ver, assets }, null, 2));
            console.log(`latest.json: version=${ver}, ${Object.keys(assets).length} 个资产`);
            for (const [n, h] of Object.entries(assets)) console.log(`  ${h}  ${n}`);
          '
          ls -la release/windows/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-ai-windows
          path: release/windows/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/windows/*
          draft: false
          generate_release_notes: true
          body: |
            ## Switch AI · Windows 安装包

            基于 [TraeWorkAssistant](https://github.com/smart-open/TraeWorkAssistant)（AI Work 助手）二次开发，
            新增 **WorkBuddy 国际版（workbuddy.ai）** 支持。

            ### 下载说明
            | 文件 | 说明 |
            | --- | --- |
            | `*_x64-setup.exe` | NSIS 安装包（推荐，支持原地升级） |
            | `*.msi` | MSI 安装包（企业分发；跨产品标识升级需先卸载旧版） |
            | `*_x64_portable.zip` | 便携版（解压即用，无需安装） |

            ### 运行要求
            - Windows 10/11 x64
            - WebView2 Runtime（Win11 及较新 Win10 通常已内置）

            > 首次使用请阅读仓库 README 的「WorkBuddy 国际版」一节了解区域选择与账号录入方式。
            > 本工具与 WorkBuddy / Trae / CodeBuddy 等官方产品均无关联，仅供学习研究。
